name: 実行時の検証

# データベース・ブラウザ・Docker を実際に動かして確かめる。
# 準備に時間がかかるものをここへ集め、静的検証（ci.yml）の待ち時間から切り離す。
#
# 動かす対象が変わらなければ結果も変わらないため、paths で対象を絞る。
# 文書だけの変更で、Postgres の起動とブラウザの取得を待たせない。

# 対象の一覧は push と pull_request で同じにする。
# YAML の別名（`&`／`*`）は GitHub Actions が読まないため、二度書く。
# 片方だけを直すと、PR で走ったものが main で走らなくなる。
on:
  push:
    branches: [main]
    paths:
      - packages/**
      - test/**
      - e2e/**
      - scripts/**
      - docker/**
      - .github/workflows/runtime.yml
      - docker-compose.yml
      - vitest.config.ts
      - playwright.config.ts
      - tsconfig.base.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .nvmrc
  pull_request:
    paths:
      - packages/**
      - test/**
      - e2e/**
      - scripts/**
      - docker/**
      - .github/workflows/runtime.yml
      - docker-compose.yml
      - vitest.config.ts
      - playwright.config.ts
      - tsconfig.base.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .nvmrc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI では既定のポートをそのまま使う（開発機のような衝突が起きないため）。
  DATABASE_URL: postgres://staffweave:staffweave@localhost:5432/staffweave
  TEST_DATABASE_URL: postgres://staffweave:staffweave@localhost:5432/staffweave_test
  # 検証用の値。32 文字以上でなければ API は起動しない。
  CARD_FINGERPRINT_KEY: ci-card-fingerprint-key-not-a-secret

jobs:
  database:
    name: マイグレーションと統合テスト
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: staffweave
          POSTGRES_PASSWORD: staffweave
          POSTGRES_DB: staffweave
          TZ: UTC
          # compose と同じ並びで作る。値の意味は docs/decisions/0001-database-collation.md。
          POSTGRES_INITDB_ARGS: >-
            --locale-provider=builtin --builtin-locale=C.UTF-8
            --lc-collate=C --lc-ctype=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffweave -d staffweave"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 統合テスト用データベースを用意
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE staffweave_test'

      - name: マイグレーションを適用
        run: pnpm db:migrate

      - name: 二度目の適用で何も起きないことを確認
        run: pnpm db:migrate

      - name: 適用漏れと内容の変更が無いことを確認
        run: pnpm db:verify

      - name: 既にデータのあるデータベースへ当てられることを確認
        # まっさらなデータベースへ流すのは上で見ている。
        # 空のテーブルなら、列を足すときの NOT NULL も期間の重なりの禁止も必ず通る。
        run: pnpm verify:upgrade

      - name: 書き出して戻したものが元と同じことを確認
        # 「取れた」「戻せた」だけでは足りない。戻したものが違っていても気付けない。
        #
        # 走らせる機械に入っている pg_dump は、動かしている PostgreSQL より古い。
        # 古い道具は新しいサーバーからの書き出しを断るため、
        # サーバーと同じ版の道具を、同じイメージから借りて使う。
        env:
          PG_DUMP: docker run --rm --network host postgres:18.4-bookworm pg_dump
          PG_RESTORE: docker run --rm -i --network host postgres:18.4-bookworm pg_restore
        run: pnpm verify:restore

      - name: まとめて流せることを確認
        # CI は単体と統合を別のジョブへ分けている。まとめて流す `pnpm test`
        # （`pnpm verify` が使う）だけが壊れても、分けたジョブでは気付けない。
        # テストを 1 件も選ばずに起動し、2 つの設定が組み上がることだけを見る。
        run: pnpm test --testNamePattern '__no_such_test__' --passWithNoTests

      - name: 統合テスト
        # 記録は次のステップが読む。実行そのものは変わらない。
        run: pnpm test:integration --reporter=default --reporter=json --outputFile=artifacts/integration-tests.json

      - name: 検証にかかる時間の偏りを確認
        run: pnpm check:balance

  e2e:
    name: 画面テスト
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: staffweave
          POSTGRES_PASSWORD: staffweave
          POSTGRES_DB: staffweave
          TZ: UTC
          # compose と同じ並びで作る。値の意味は docs/decisions/0001-database-collation.md。
          POSTGRES_INITDB_ARGS: >-
            --locale-provider=builtin --builtin-locale=C.UTF-8
            --lc-collate=C --lc-ctype=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffweave -d staffweave"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 画面テスト用データベースを用意
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE staffweave_e2e'

      # ブラウザは 1 回の取得に 25 秒かかる。中身は Playwright の版で決まるため、
      # pnpm-lock.yaml が同じ間は取り直さない。
      - name: 前に取得したブラウザを使う
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # ブラウザが要る OS 側の部品は、上の取り置きに入らない。
      # 取り置きが当たった回にだけ入れないでいると、webkit が起動できずに落ちる。
      # 部品の用意は毎回行い、取り置きで省くのは本体の取得だけにする。
      - name: ブラウザが要る部品を用意
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: ブラウザを取得
        if: steps.browser.outputs.cache-hit != 'true'
        # 3 系統を取る。同じ HTML でも、日付の入力欄・焦点の移り方・
        # 書字の折り返しは実装ごとに違う。1 つだけでは、他で壊れていても気付けない。
        run: pnpm exec playwright install chromium firefox webkit

      - name: 画面テスト
        run: pnpm test:e2e

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  container:
    name: コンテナのビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: イメージをビルド
        # 公開する成果物ではないため、ここではビルドが通ることだけを確かめる。
        run: docker build -f docker/api.Dockerfile -t staffweave:ci .

      - name: 通信できない状態で入口が動くことを確認
        # 実行段へ pnpm を置くと、corepack が起動のたびに取り寄せに行き、
        # 通信できない環境ではそこで落ちる。落ちないことを実際に通信を切って確かめる。
        run: docker run --rm --network none staffweave:ci tsx --version
