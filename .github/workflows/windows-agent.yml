name: Windows の配布物

# Windows 向けの配布物を組み、その上で常駐できるかを確かめる。
#
# これまで確かめていたのは、登録する script の文字列だけだった。
# 文字列は読めても、Windows がその通りに動くとは限らない。実際、
# `sc.exe create` で node.exe を登録する形は、登録は通っても起動できなかった
# （docs/decisions/0002-windows-residency.md）。
#
# 登録 → 開始 → 動作中 → 停止 → 停止済み → 削除までを、Windows の上で通す。
# 実機でしか確かめられないもの（読み取り装置、端末の再起動）は #194 と #195 に残る。

on:
  push:
    branches: [main]
    paths:
      - 'packages/agent/**'
      - 'scripts/package-agent.sh'
      - '.github/workflows/windows-agent.yml'
  pull_request:
    paths:
      - 'packages/agent/**'
      - 'scripts/package-agent.sh'
      - '.github/workflows/windows-agent.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-agent:
    name: 配布物を組み、登録から削除までを Windows で通す
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 組むのは Linux と同じ手順。Windows の runner にも bash がある。
      - name: 配布物を組む
        shell: bash
        run: ./scripts/package-agent.sh artifacts/agent

      # Windows 向けの配布物。読み取り装置の部品は組み立てが要るため、
      # ここでしか作れない。端末では取り寄せない。
      - name: Windows 向けの配布物を組む
        shell: bash
        env:
          AGENT_READER_MODULE: pcsclite@1.0.1
        run: ./scripts/package-agent.sh artifacts/windows-agent-bundle

      # 配布物だけの場所から、通信せずに読み取りの部品を読めること。
      # ここが通らなければ、端末の前で初めて読めないと分かる。
      - name: 通信せずに読み取りの部品を読めることを確かめる
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'artifacts/windows-agent-bundle/staffweave-agent'
          $probe = @"
          const { createRequire } = await import('node:module');
          const require = createRequire('$($bundle -replace '\\', '/')/package.json');
          const pcsc = require('pcsclite');
          if (typeof pcsc !== 'function') throw new Error('読み取りの部品の形が違います');
          console.log('読み取りの部品を読めました');
          "@
          $probe | Out-File -Encoding utf8 probe.mjs
          node probe.mjs

      # 配布物の根から、--pcsc を省いた普通の経路で起動できること。
      #
      # Windows へ登録すると作業ディレクトリは配布物の根になる。既定の場所を
      # 作業ディレクトリからの相対で書いていたため、隣の agent/card/... ではなく
      # 根の直下を探していた。ここを通していなかったので気付けなかった。
      - name: 配布物の根から、既定の受け渡しを読めることを確かめる
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/windows-agent-bundle/staffweave-agent'
          $store = "$PWD/default-path-store.json"
          @"
          {
            "baseUrl": "https://staffweave.invalid",
            "deviceId": "00000000-0000-4000-8000-000000000000",
            "workspaceSlug": "default",
            "privateKeyPem": "",
            "publicKeyPem": "",
            "nextSequence": 1
          }
          "@ | Out-File -Encoding ascii $store

          Push-Location $root
          try {
            $output = & node agent/cli.js diagnose --store $store 2>&1 | Out-String
          } finally {
            Pop-Location
          }
          Write-Host $output

          # 読み込む場所を間違えていれば「読み込めませんでした」になる。
          if ($output -match '読み込めませんでした') {
            throw "既定の受け渡しを読めていません: $output"
          }
          # Windows 向けの配布物には部品が入っているので、装置の名前まで出るか、
          # 装置が無いという言葉になる。どちらでも、受け渡しは読めている。
          if ($output -notmatch '読み取り装置:') {
            throw "診断に読み取り装置の行がありません: $output"
          }

      # Windows の runner に zip コマンドは無い。PowerShell の圧縮を使う。
      - name: 配布物をまとめる
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path artifacts/windows-agent | Out-Null
          Compress-Archive -Path artifacts/windows-agent-bundle/staffweave-agent `
            -DestinationPath "artifacts/windows-agent/staffweave-agent-windows-x64-$version.zip" `
            -CompressionLevel Optimal -Force

      # 読み取りの部品とその先の依存まで含めた構成は、ここで組んだものにしかない。
      - name: 構成一覧を書き出す
        shell: bash
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@4.0.2 \
            --omit dev \
            --output-format json \
            --output-file artifacts/windows-agent/staffweave-agent-windows.cdx.json \
            -- artifacts/windows-agent-bundle/staffweave-agent/package.json
          # 作る道具は元の commit を書けない。書かないと、その構成がいつの
          # ソースから出来ているかを受け取った側が確かめられない。
          node scripts/stamp-sbom-source.mjs \
            artifacts/windows-agent/staffweave-agent-windows.cdx.json "$GITHUB_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staffweave-windows-agent-${{ github.sha }}
          path: artifacts/windows-agent
          if-no-files-found: error
          retention-days: 14

      # 資格情報が無いまま登録できないこと。無いまま登録すると、登録は成功し、
      # 端末の起動後に読めずに落ちる。落ちてから理由を探すことになる。
      - name: 資格情報が無ければ登録しないことを確かめる
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/agent/staffweave-agent'
          $node = (Get-Command node).Source
          $missing = "$PWD/not-enrolled/agent.json"

          $failed = $false
          try {
            & "$root/install-startup.ps1" -NodePath $node -AgentRoot $root `
              -TaskName 'StaffWeaveMissingStore' -Store $missing -NoReader
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          } catch {
            $failed = $true
          }
          if (-not $failed) {
            Unregister-ScheduledTask -TaskName 'StaffWeaveMissingStore' -Confirm:$false `
              -ErrorAction SilentlyContinue
            throw '資格情報が無いのに登録できてしまいました'
          }
          $task = Get-ScheduledTask -TaskName 'StaffWeaveMissingStore' -ErrorAction SilentlyContinue
          if ($task) { throw '登録が残っています' }

      # 導入の順どおりに通す。置き場を用意 → 登録（資格情報を置く）→ 常駐の登録。
      - name: 置き場を用意して、常駐として登録する
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/agent/staffweave-agent'
          $node = (Get-Command node).Source
          $store = "$PWD/store/StaffWeave/agent.json"

          & "$root/install-store.ps1" -Store $store

          # 権限が絞れていること。誰でも読める場所に端末の秘密鍵は置けない。
          $directory = Split-Path -Parent $store
          $open = (Get-Acl $directory).Access | Where-Object {
            $_.IdentityReference -match 'Everyone|BUILTIN\\Users|Authenticated Users' -and
            $_.AccessControlType -eq 'Allow'
          }
          if ($open) { throw "置き場が広く開いています: $directory" }

          # enroll はサーバーが要る。ここでは同じ場所へ資格情報を置いて代える。
          @"
          {
            "baseUrl": "https://staffweave.invalid",
            "deviceId": "00000000-0000-4000-8000-000000000000",
            "workspaceSlug": "default",
            "privateKeyPem": "",
            "publicKeyPem": "",
            "nextSequence": 1
          }
          "@ | Out-File -Encoding ascii $store

          & "$root/install-startup.ps1" -NodePath $node -AgentRoot $root -Store $store -NoReader
          $task = Get-ScheduledTask -TaskName 'StaffWeaveAgent'
          if ($task.State -eq 'Disabled') { throw '登録した作業が無効になっています' }

          # あとの段が同じ置き場を使えるようにする。
          "AGENT_STORE=$store" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # 端末の再起動は runner では起こせない。手で開始して、動き続けることを見る。
      - name: 開始して、動き続けることを確かめる
        shell: pwsh
        run: |
          Start-ScheduledTask -TaskName 'StaffWeaveAgent'
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            if ((Get-ScheduledTask -TaskName 'StaffWeaveAgent').State -eq 'Running') { break }
            Start-Sleep -Seconds 1
          }
          $state = (Get-ScheduledTask -TaskName 'StaffWeaveAgent').State
          if ($state -ne 'Running') { throw "開始できていません: $state" }

          # すぐ落ちていないこと。落ちる形なら、この待ちの後に Ready へ戻る。
          Start-Sleep -Seconds 10
          $state = (Get-ScheduledTask -TaskName 'StaffWeaveAgent').State
          if ($state -ne 'Running') { throw "動き続けていません: $state" }

      # 行儀よく終わること。Windows には「行儀よく終われ」という合図が無いため、
      # 製品側の合図（agent stop）で終わらせる。
      - name: 行儀よく止まることを確かめる
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/agent/staffweave-agent'
          $node = (Get-Command node).Source
          & $node "$root/agent/cli.js" stop --store $env:AGENT_STORE

          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            if ((Get-ScheduledTask -TaskName 'StaffWeaveAgent').State -ne 'Running') { break }
            Start-Sleep -Seconds 1
          }
          $state = (Get-ScheduledTask -TaskName 'StaffWeaveAgent').State
          if ($state -eq 'Running') { throw '止まりませんでした（強制終了に頼らせない）' }

      # 読み取りを待っている状態からでも止まること。据え置きの端末は、カードが
      # 置かれていない時間のほうが長い。その待ちを打ち切れないと、止めろと
      # 言われてもプロセスが終わらない。
      - name: カード待ちからでも止まることを確かめる
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/windows-agent-bundle/staffweave-agent'
          $node = (Get-Command node).Source
          $store = "$PWD/station-store.json"

          # 装置は無いので、カードが来ないまま待ち続ける受け渡しを渡す。
          #
          # 待っている間は輪を保つ（setInterval）。保たないと、解決しない Promise は
          # Node の輪を押さえないため、送信側さえ止まればプロセスは終われてしまう。
          # 合図が読み取りまで届いていなくても緑になり、この検査は何も見ていない
          # ことになる。本物の装置は待ち受けを持つので、そちらへ寄せる。
          @'
          export function createPcscTransport() {
            const waiting = (signal) => new Promise((_resolve, reject) => {
              const holder = setInterval(() => {}, 1000);
              const finish = () => { clearInterval(holder); reject(new Error('aborted')); };
              if (signal?.aborted) { finish(); return; }
              signal?.addEventListener('abort', finish, { once: true });
            });
            return {
              name: 'never',
              waitForCard: waiting,
              transmit: async () => new Uint8Array([0x90, 0x00]),
              waitForRemoval: waiting,
              reconnect: async () => {},
              close: async () => { console.log('transport-closed'); },
            };
          }
          '@ | Out-File -Encoding utf8 never-transport.mjs

          # 端末として登録されていないと station は動かない。資格情報を置く。
          @"
          {
            "baseUrl": "https://staffweave.invalid",
            "deviceId": "00000000-0000-4000-8000-000000000000",
            "workspaceSlug": "default",
            "privateKeyPem": "",
            "publicKeyPem": "",
            "nextSequence": 1,
            "cardFingerprintKey": "0123456789abcdef"
          }
          "@ | Out-File -Encoding ascii $store

          $proc = Start-Process -FilePath $node -PassThru -NoNewWindow `
            -ArgumentList "`"$root/agent/cli.js`"", 'station', '--store', "`"$store`"", `
              '--pcsc', "`"$PWD/never-transport.mjs`""
          Start-Sleep -Seconds 8
          if ($proc.HasExited) { throw "常駐が上がりませんでした（exit=$($proc.ExitCode)）" }

          $started = Get-Date
          & $node "$root/agent/cli.js" stop --store $store
          if (-not $proc.WaitForExit(20000)) {
            $proc.Kill()
            throw 'カードを待っている間に止められませんでした'
          }
          $elapsed = ((Get-Date) - $started).TotalSeconds
          Write-Host "止まるまで $elapsed 秒"

      # 対応していない版の Node で起動したとき、組み込みの読み込みより先に、
      # こちらの言葉で止まること。組み込みが落ちる言葉では、端末の前の人に
      # 何をすればよいかが分からない。
      - name: 違う版の Node では、先に止まることを確かめる
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/windows-agent-bundle/staffweave-agent'
          $expected = (Get-Content "$root/agent/build-info.json" -Raw | ConvertFrom-Json).nodeMajor
          Write-Host "配布物が対応する Node: $expected"

          # 対応していない版を用意する。
          $other = if ($expected -eq '22') { '20' } else { '22' }
          $dir = Join-Path $PWD "node-$other"
          $url = "https://nodejs.org/dist/latest-v$other.x/win-x64/node.exe"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$dir/node.exe"
          $otherNode = "$dir/node.exe"
          Write-Host "用意した Node: $(& $otherNode -v)"

          $store = "$PWD/mismatch-store.json"
          Copy-Item "$PWD/station-store.json" $store

          $output = & $otherNode "$root/agent/cli.js" station --store $store 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw '対応していない版で起動できてしまいました' }
          if ($output -notmatch "この配布物は Node $expected 用です") {
            throw "こちらの言葉で止まっていません: $output"
          }

          # 登録の手順も、渡された Node の版を先に確かめる。
          $failed = $false
          try {
            & "$root/install-startup.ps1" -NodePath $otherNode -AgentRoot $root `
              -TaskName 'StaffWeaveMismatch' -Store $store -NoReader
          } catch {
            $failed = $true
            Write-Host "登録は断られました: $($_.Exception.Message)"
          }
          if (-not $failed) {
            Unregister-ScheduledTask -TaskName 'StaffWeaveMismatch' -Confirm:$false `
              -ErrorAction SilentlyContinue
            throw '対応していない版で登録できてしまいました'
          }

      - name: 常駐を外す
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/agent/staffweave-agent'
          $node = (Get-Command node).Source
          & "$root/uninstall-startup.ps1" -NodePath $node -AgentRoot $root `
            -Store $env:AGENT_STORE

          $task = Get-ScheduledTask -TaskName 'StaffWeaveAgent' -ErrorAction SilentlyContinue
          if ($task) { throw '登録が残っています' }
