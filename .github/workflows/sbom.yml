name: SBOM

# 配布物の構成一覧を作る。
#
# PR では走らせない。SBOM が答えるのは「main にあるものが何でできているか」であり、
# 提案の段階では読み手がいない。生成に 45 秒かかるため、PR の待ち時間だけが増える。
# 依存が変わったかどうかは、PR の差分（pnpm-lock.yaml）を見れば分かる。

on:
  push:
    branches: [main]
  # 依存の勧告を追うときなど、main を変えずに取り直したいことがある。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: SBOM の生成と検証
    runs-on: ubuntu-latest

    # 生成するだけで、まだどこへも配らない。読み取りだけで足りる。
    # 署名する成果物が決まっていないため、attestation 用の権限は付けない。
    permissions:
      contents: read

    steps:
      # 新しく足す Action は完全なコミット SHA へ固定する。
      # tag は同じ名前のまま指す先が変わりうるため、版として当てにできない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 生成物へ混ざってはいけない値を、実際に環境へ置いて確かめる。
      # 実在しない目印を使う。実在する秘密情報は置かない。
      - name: SBOM を生成する
        env:
          SBOM_CANARY: SBOM_MUST_NOT_CONTAIN_THIS_VALUE
        run: pnpm sbom:generate

      # 書いてある commit が、いま見ているものと同じかを突き合わせる。
      # 突き合わせないと、古い SBOM を配っても気付けない。
      - name: SBOM を検証する
        env:
          SBOM_CANARY: SBOM_MUST_NOT_CONTAIN_THIS_VALUE
          SBOM_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: pnpm sbom:verify

      - name: SBOM を成果物として残す
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staffweave-sbom-${{ github.sha }}
          path: |
            artifacts/sbom/staffweave-workspace.cdx.json
            artifacts/sbom/staffweave-workspace.cdx.json.sha256
            artifacts/sbom/staffweave-container.cdx.json
            artifacts/sbom/staffweave-container.cdx.json.sha256
          if-no-files-found: error
          retention-days: 14
