name: CI

# どの変更でも必ず走らせる検証。
# 何も立ち上げずに済むものだけを置き、最初の合否をできるだけ早く返す。
#
# データベース・ブラウザ・Docker を要する検証は runtime.yml、
# 配布物の構成一覧は sbom.yml にある。
#
# 使う Action は完全な SHA へ固定する。tag は同じ名前のまま指す先が変わりうるため、
# 版として当てにできない。指す先が変われば、確かめずに他人のコードを動かすことになる。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静的検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # 依存のキャッシュはこれだけに絞る。取得のやり直しが最も重いため。
          cache: pnpm

      - name: 依存の再現性を確認
        # ロックファイルと package.json が食い違っていればここで落ちる。
        run: pnpm install --frozen-lockfile

      - name: lint と format
        run: pnpm lint

      - name: 型検査
        run: pnpm typecheck

      - name: 単体テスト
        run: pnpm test:unit

      - name: リポジトリの不変条件
        # この job は PR が書き換えられる側のコードを動かす。したがって Secret を渡さない。
        # 渡すと、脚本を 1 行変えた PR から中身を読み出せる。
        run: pnpm check:policy

      - name: 依存の脆弱性
        run: pnpm check:audit
