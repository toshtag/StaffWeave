name: CI

# どの変更でも必ず走らせる検証。
# 何も立ち上げずに済むものだけを置き、最初の合否をできるだけ早く返す。
#
# データベース・ブラウザ・Docker を要する検証は runtime.yml、
# 配布物の構成一覧は sbom.yml にある。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静的検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 決めごとの検査は branch 名と commit も見る。
          # 既定の 1 コミットだけでは、範囲を読めないまま「無い」と答えることになる。
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # 依存のキャッシュはこれだけに絞る。取得のやり直しが最も重いため。
          cache: pnpm

      - name: 依存の再現性を確認
        # ロックファイルと package.json が食い違っていればここで落ちる。
        run: pnpm install --frozen-lockfile

      - name: lint と format
        run: pnpm lint

      - name: 型検査
        run: pnpm typecheck

      - name: 単体テスト
        run: pnpm test:unit

      - name: リポジトリの決めごと
        run: pnpm check:policy
        # PR の題と本文は、checkout した中身のどこにも現れない。
        # 渡さないと、他の製品への言及の検査が PR の側だけを見落とす。
        #
        # 値は run: へ展開せず、環境変数として渡す。展開すると、
        # PR の題に書いた文字列が、そのままシェルの命令として動く。
        #
        # この job は PR が書き換えられる側のコードを動かす。したがって Secret を渡さない。
        # 渡すと、脚本を 1 行変えた PR から中身を読み出せる。
        # Secret を使う検査が要るなら、PR のコードを動かさない別のワークフローへ置く。
        #
        # branch と commit の範囲は、Git の状態から推測させず、event から渡す。
        # checkout は PR では detached HEAD になり、branch 名を辿れない。
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          POLICY_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 依存の脆弱性
        run: pnpm check:audit
