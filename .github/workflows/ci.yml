name: CI

# 目的は「main へ入る前に、ローカルで必須としている検証をすべて機械的に通すこと」。
# 検証の内容はローカルと同じコマンドを使い、CI でしか通らない状態を作らない。

on:
  push:
    branches: [main]
  pull_request:
  # SBOM だけを取り直したいときに、手で起動できるようにする。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI では既定のポートをそのまま使う（開発機のような衝突が起きないため）。
  DATABASE_URL: postgres://staffweave:staffweave@localhost:5432/staffweave
  TEST_DATABASE_URL: postgres://staffweave:staffweave@localhost:5432/staffweave_test
  # 検証用の値。32 文字以上でなければ API は起動しない。
  CARD_FINGERPRINT_KEY: ci-card-fingerprint-key-not-a-secret

jobs:
  static:
    name: 静的検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # 依存のキャッシュはこれだけに絞る。取得のやり直しが最も重いため。
          cache: pnpm

      - name: 依存の再現性を確認
        # ロックファイルと package.json が食い違っていればここで落ちる。
        run: pnpm install --frozen-lockfile

      - name: lint と format
        run: pnpm lint

      - name: 型検査
        run: pnpm typecheck

      - name: 単体テスト
        run: pnpm test:unit

      - name: リポジトリの決めごと
        run: pnpm check:policy

      - name: 依存の脆弱性
        run: pnpm check:audit

  database:
    name: マイグレーションと統合テスト
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: staffweave
          POSTGRES_PASSWORD: staffweave
          POSTGRES_DB: staffweave
          TZ: UTC
          # compose と同じ並びで作る。値の意味は docs/decisions/0003-database-collation.md。
          POSTGRES_INITDB_ARGS: >-
            --locale-provider=builtin --builtin-locale=C.UTF-8
            --lc-collate=C --lc-ctype=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffweave -d staffweave"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 統合テスト用データベースを用意
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE staffweave_test'

      - name: マイグレーションを適用
        run: pnpm db:migrate

      - name: 二度目の適用で何も起きないことを確認
        run: pnpm db:migrate

      - name: 適用漏れと内容の変更が無いことを確認
        run: pnpm db:verify

      - name: 統合テスト
        run: pnpm test:integration

  e2e:
    name: 画面テスト
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: staffweave
          POSTGRES_PASSWORD: staffweave
          POSTGRES_DB: staffweave
          TZ: UTC
          # compose と同じ並びで作る。値の意味は docs/decisions/0003-database-collation.md。
          POSTGRES_INITDB_ARGS: >-
            --locale-provider=builtin --builtin-locale=C.UTF-8
            --lc-collate=C --lc-ctype=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffweave -d staffweave"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 画面テスト用データベースを用意
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE staffweave_e2e'

      - name: ブラウザを取得
        run: pnpm exec playwright install --with-deps chromium

      - name: 画面テスト
        run: pnpm test:e2e

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  container:
    name: コンテナのビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: イメージをビルド
        # 公開する成果物ではないため、ここではビルドが通ることだけを確かめる。
        run: docker build -f docker/api.Dockerfile -t staffweave:ci .

      - name: 通信できない状態で入口が動くことを確認
        # 実行段へ pnpm を置くと、corepack が起動のたびに取り寄せに行き、
        # 通信できない環境ではそこで落ちる。落ちないことを実際に通信を切って確かめる。
        run: docker run --rm --network none staffweave:ci tsx --version

  sbom:
    name: SBOM の生成と検証
    runs-on: ubuntu-latest

    # 生成するだけで、まだどこへも配らない。読み取りだけで足りる。
    # 署名する成果物が決まっていないため、attestation 用の権限は付けない。
    permissions:
      contents: read

    steps:
      # 新しく足す Action は完全なコミット SHA へ固定する。
      # tag は同じ名前のまま指す先が変わりうるため、版として当てにできない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 生成物へ混ざってはいけない値を、実際に環境へ置いて確かめる。
      # 実在しない目印を使う。実在する秘密情報は置かない。
      - name: SBOM を生成する
        env:
          SBOM_CANARY: SBOM_MUST_NOT_CONTAIN_THIS_VALUE
        run: pnpm sbom:generate

      - name: SBOM を検証する
        env:
          SBOM_CANARY: SBOM_MUST_NOT_CONTAIN_THIS_VALUE
        run: pnpm sbom:verify

      - name: SBOM を成果物として残す
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staffweave-sbom-${{ github.sha }}
          path: |
            artifacts/sbom/staffweave-workspace.cdx.json
            artifacts/sbom/staffweave-workspace.cdx.json.sha256
            artifacts/sbom/staffweave-container.cdx.json
            artifacts/sbom/staffweave-container.cdx.json.sha256
          if-no-files-found: error
          retention-days: 14
