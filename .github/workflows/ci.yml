name: CI

# どの変更でも必ず走らせる検証。
# 何も立ち上げずに済むものだけを置き、最初の合否をできるだけ早く返す。
#
# データベース・ブラウザ・Docker を要する検証は runtime.yml、
# 配布物の構成一覧は sbom.yml にある。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静的検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # 依存のキャッシュはこれだけに絞る。取得のやり直しが最も重いため。
          cache: pnpm

      - name: 依存の再現性を確認
        # ロックファイルと package.json が食い違っていればここで落ちる。
        run: pnpm install --frozen-lockfile

      - name: lint と format
        run: pnpm lint

      - name: 型検査
        run: pnpm typecheck

      - name: 単体テスト
        run: pnpm test:unit

      - name: リポジトリの決めごと
        run: pnpm check:policy

      - name: 依存の脆弱性
        run: pnpm check:audit
