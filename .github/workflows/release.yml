name: Release

# 正式版を配る。
#
# tag を押したときだけ Release を作る。手動では、tag を作らずに
# 「作れるか」だけを確かめられるようにしてある（workflow_dispatch）。
# 確かめる経路が無いと、tag を押した本番で初めて壊れていることが分かる。
#
# 署名はしない。署名には所有者の鍵が要り、鍵を持たない者が付けた署名は
# 「誰が配ったか」を示せない（docs/release/checklist.md）。
#
# 使う Action は完全な SHA へ固定する。tag は同じ名前のまま指す先が変わりうる。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Release を作らず、成果物を組めるかだけを確かめる'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 配る前に、その commit が確かめられていることを見る。
  #
  # これまでは、tag を押すと Release の workflow だけが動き、そのまま配布まで
  # 進んだ。運用する人が事前にゲートを実行する前提だったため、押し間違えれば
  # 確かめていない commit がそのまま出ていく。
  #
  # 見るのは「その SHA で」必須の workflow が成功していること。branch の最新が
  # 緑であることは、tag を押した commit が緑であることを意味しない。
  gate:
    name: この commit が確かめられているか
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: 必須の workflow がこの SHA で成功しているか
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/verify-release-checks.mjs

  # Windows 向けの配布物は、Windows の上でしか組めない。読み取り装置の部品に
  # 組み立てが要り、組み立て済みのものを Linux で作って配ることはできない。
  windows-agent:
    name: Windows 向けの配布物を組む
    runs-on: windows-latest
    needs: gate

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 配布物を組む
        shell: bash
        env:
          AGENT_READER_MODULE: pcsclite@1.0.1
        run: ./scripts/package-agent.sh artifacts/windows-agent-bundle

      - name: まとめて構成一覧を書き出す
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path artifacts/windows-agent | Out-Null
          Compress-Archive -Path artifacts/windows-agent-bundle/staffweave-agent `
            -DestinationPath "artifacts/windows-agent/staffweave-agent-windows-x64-$version.zip" `
            -CompressionLevel Optimal -Force
          npx --yes @cyclonedx/cyclonedx-npm@4.0.2 --omit dev --output-format json `
            --output-file artifacts/windows-agent/staffweave-agent-windows.cdx.json `
            -- artifacts/windows-agent-bundle/staffweave-agent/package.json
          # 作る道具は元の commit を書けない。書かないと、その構成がいつの
          # ソースから出来ているかを受け取った側が確かめられない。
          node scripts/stamp-sbom-source.mjs `
            artifacts/windows-agent/staffweave-agent-windows.cdx.json $env:GITHUB_SHA

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-agent
          path: artifacts/windows-agent
          if-no-files-found: error
          retention-days: 1

  assets:
    name: 成果物を組み、元との対応を確かめる
    runs-on: ubuntu-latest
    # ゲートを通らなければ、成果物を組むところまで行かない。
    # 手動の確認でも同じ順序にする。確かめる経路と本番の経路を別物にしない。
    needs: [gate, windows-agent]

    # tag から Release を作るときだけ書き込みが要る。
    # 手動の確認では読み取りだけで足りるが、job を分けると
    # 確かめる経路と本番の経路が別物になる。同じ job のまま、作る手順だけを分ける。
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b # v6.0.0
        with:
          name: windows-agent
          path: artifacts/windows-agent

      # 生成物へ混ざってはいけない値を、実際に環境へ置いて確かめる。
      # 実在しない目印を使う。実在する秘密情報は置かない。
      - name: 成果物を組む
        env:
          SBOM_CANARY: SBOM_MUST_NOT_CONTAIN_THIS_VALUE
          # Windows 向けの配布物が無ければ、そこで止める。読み取り装置を使う
          # 端末へ配るものが欠けたまま「配れる」と言わない。
          RELEASE_REQUIRE_WINDOWS_AGENT: '1'
        run: pnpm release:assets

      - name: 構成一覧の中身を確かめる
        env:
          SBOM_CANARY: SBOM_MUST_NOT_CONTAIN_THIS_VALUE
          SBOM_OUTPUT_DIR: artifacts/release
          SBOM_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: pnpm sbom:verify

      # 版・commit・checksum が噛み合っていることを、配る前に見る。
      # 「ファイルがある」だけでは、古い成果物を配るのを止められない。
      - name: 配るものと元の対応を確かめる
        env:
          RELEASE_EXPECTED_SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_REQUIRE_WINDOWS_AGENT: '1'
        run: pnpm release:verify

      - name: 成果物を残す
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staffweave-release-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14

      # tag を押したときだけ Release を作る。
      # 手動の確認はここまでで終わり、配るものは成果物として残るだけ。
      - name: GitHub Release を作る
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file artifacts/release/release-manifest.txt \
            --verify-tag \
            artifacts/release/*
