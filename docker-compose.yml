services:
  db:
    image: postgres:17-alpine
    container_name: staffweave-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: staffweave
      POSTGRES_PASSWORD: staffweave
      POSTGRES_DB: staffweave
      # 日跨ぎ勤務の判定は業務日として明示的に計算するため、DB のタイムゾーンは UTC で固定する。
      TZ: UTC
      PGTZ: UTC
    ports:
      # 他プロジェクトの PostgreSQL と衝突しないよう、既定のホスト側ポートを 5433 にする。
      # 変更する場合は .env の DATABASE_URL / TEST_DATABASE_URL も合わせること。
      - '${DB_HOST_PORT:-5433}:5432'
    volumes:
      - staffweave-db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U staffweave -d staffweave']
      interval: 5s
      timeout: 3s
      retries: 20

  # アプリケーション本体。`docker compose --profile app up -d` で起動する。
  # 開発中は pnpm dev を使い、この定義はセルフホストの確認と CI のビルド検査に使う。
  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # ワーカーと同じイメージを使う。同じ名前にすることでビルドは 1 回で済む。
    image: staffweave-app
    container_name: staffweave-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://staffweave:staffweave@db:5432/staffweave
      API_HOST: 0.0.0.0
      API_PORT: '8787'
      NODE_ENV: production
      DEFAULT_WORKSPACE_SLUG: ${DEFAULT_WORKSPACE_SLUG:-default}
      CARD_FINGERPRINT_KEY: ${CARD_FINGERPRINT_KEY:-}
      WEB_DIST_PATH: /app/packages/web/dist
    ports:
      - '${APP_HOST_PORT:-8787}:8787'

  # Webhook の送信ワーカー。API は送信待ちを記録するだけなので、
  # このプロセスを動かさない限り Webhook は届かない。
  webhook-worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: staffweave-app
    container_name: staffweave-webhook-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://staffweave:staffweave@db:5432/staffweave
      NODE_ENV: production
      WEBHOOK_WORKER_POLL_INTERVAL_MS: ${WEBHOOK_WORKER_POLL_INTERVAL_MS:-5000}
      WEBHOOK_SEND_TIMEOUT_MS: ${WEBHOOK_SEND_TIMEOUT_MS:-10000}
      WEBHOOK_CLAIM_LEASE_MS: ${WEBHOOK_CLAIM_LEASE_MS:-60000}
    command: ['pnpm', '--filter', '@staffweave/api', 'webhook-worker']

volumes:
  staffweave-db-data:
