# 一覧へ並ぶ名前を、置き場所ではなくここで決める。
# 決めないと clone 先のディレクトリ名から作られ、同じものを別の場所へ置いただけで
# 別のネットワークとボリュームが増える。名前は staffweave と staffweave-* で揃える。
name: staffweave

# app とワーカーは同じイメージで、同じ接続先を見る。違うのは入口と、
# それぞれにだけ効く設定だけなので、共通の部分はここへ一度だけ書く。
# 二か所へ書くと、片方だけ古い値が残っている状態を作れてしまう。
x-app-base: &app-base
  profiles: ['app']
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  # 二つの service が同じ名前を指す。ビルドの定義も同じにすることで、
  # `docker compose build` が同じイメージを二度作らない。
  image: staffweave
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

x-app-environment: &app-environment
  # 接続先は db service。資格情報は db と同じ .env の値から組み立てる。
  DATABASE_URL: postgres://${DB_USER:-staffweave}:${DB_PASSWORD:-staffweave}@db:5432/${DB_NAME:-staffweave}
  NODE_ENV: production
  # 送信先の制限は API とワーカーで同じ値にする。片方だけ緩い状態を作らない。
  WEBHOOK_NETWORK_POLICY: ${WEBHOOK_NETWORK_POLICY:-public-only}

services:
  db:
    image: postgres:18-alpine
    container_name: staffweave-db
    restart: unless-stopped
    # 資格情報はここへ書かず、.env から与える。
    # compose ファイルへ書くと、docs/deployment.md の「公開する前に」で求めている
    # DB_PASSWORD の変更を、利用者が .env だけで行えなくなる。
    environment:
      POSTGRES_USER: ${DB_USER:-staffweave}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staffweave}
      POSTGRES_DB: ${DB_NAME:-staffweave}
      # 日跨ぎ勤務の判定は業務日として明示的に計算するため、DB のタイムゾーンは UTC で固定する。
      TZ: UTC
      PGTZ: UTC
    ports:
      # 既定ではループバックにだけ公開する。0.0.0.0 へ結び付けると、
      # 公開ネットワークに面したホストで PostgreSQL がそのまま開く。
      # 他のホストから直接つなぐ場合だけ DB_HOST_BIND を変える。
      #
      # 他プロジェクトの PostgreSQL と衝突しないよう、既定のホスト側ポートを 5433 にする。
      # 変更する場合は .env の DATABASE_URL / TEST_DATABASE_URL も合わせること。
      - '${DB_HOST_BIND:-127.0.0.1}:${DB_HOST_PORT:-5433}:5432'
    volumes:
      # 18 以降の公式イメージは、データを major ごとの下位ディレクトリ
      # （/var/lib/postgresql/18/docker）へ置く。/var/lib/postgresql/data を
      # そのまま結び付けると、使われない場所へ結び付けたまま起動しなくなる。
      # 親を結び付けておくと、将来 pg_upgrade --link を同じ結び付けの中で実行できる。
      - db-data:/var/lib/postgresql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "${DB_USER:-staffweave}" -d "${DB_NAME:-staffweave}"',
        ]
      # 起動の直後だけ 1 秒ごとに確かめる。準備できた時点ですぐ次へ進むため、
      # app が待つ時間が interval の分だけ伸びない。
      start_period: 30s
      start_interval: 1s
      # 準備できた後は間隔を空ける。落ちていないことを毎秒確かめる理由がない。
      interval: 30s
      timeout: 3s
      retries: 3

  # アプリケーション本体。`docker compose --profile app up -d` で起動する。
  # 開発中は pnpm dev を使い、この定義はセルフホストの確認と CI のビルド検査に使う。
  app:
    <<: *app-base
    container_name: staffweave-app
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
      API_PORT: 8787
      DEFAULT_WORKSPACE_SLUG: ${DEFAULT_WORKSPACE_SLUG:-default}
      WEB_DIST_PATH: /app/packages/web/dist
      WEBHOOK_TARGET_VALIDATION_TIMEOUT_MS: ${WEBHOOK_TARGET_VALIDATION_TIMEOUT_MS:-3000}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-262144}
      MAX_BULK_REQUEST_BODY_BYTES: ${MAX_BULK_REQUEST_BODY_BYTES:-8388608}
      # 値を書かず、ホスト側に設定があるときだけ渡す。
      # 既定値を書くと、空の鍵のまま起動してしまう。
      CARD_FINGERPRINT_KEY:
    ports:
      # 既定ではループバックにだけ公開する。HTTPS の終端は前段で行う前提のため、
      # 直接公開する場合だけ APP_HOST_BIND を変える。
      - '${APP_HOST_BIND:-127.0.0.1}:${APP_HOST_PORT:-8787}:8787'

  # Webhook の送信ワーカー。API は送信待ちを記録するだけなので、
  # このプロセスを動かさない限り Webhook は届かない。
  worker:
    <<: *app-base
    container_name: staffweave-worker
    environment:
      <<: *app-environment
      WEBHOOK_WORKER_POLL_INTERVAL_MS: ${WEBHOOK_WORKER_POLL_INTERVAL_MS:-5000}
      WEBHOOK_SEND_TIMEOUT_MS: ${WEBHOOK_SEND_TIMEOUT_MS:-10000}
      WEBHOOK_CLAIM_LEASE_MS: ${WEBHOOK_CLAIM_LEASE_MS:-60000}
    # イメージには pnpm を入れていないため、tsx を直接呼ぶ。
    command: ['tsx', '--env-file-if-exists=.env', 'packages/api/src/cli/run-webhook-worker.ts']

volumes:
  db-data:
    # 名前を明示する。決めないと、プロジェクト名を前に付けた
    # staffweave_staffweave-db-data のように、同じ語が重なった名前で並ぶ。
    name: staffweave-db-data

networks:
  default:
    # 既定のままだと staffweave_default になる。付ける意味のない接尾辞を外す。
    name: staffweave
